# npx skills (https://skills.sh) で入れる外部スキルの宣言。
# run_onchange_after_05-skills-install.sh.tmpl がこの内容のハッシュで再実行し、
# `npx skills add <source> -g -s <skill>... -a <agent>... -y` を流す。
#
# 実体は ~/.agents/skills/<name> に置かれる。codex / cursor はそこを直接読み、
# claude-code には ~/.claude/skills/<name> の symlink が張られる。
#
# 自作スキルはここに書かず chezmoi/dot_agents/skills/ に置く。
# hooks / MCP などを伴うものは Claude Code プラグインにする
# (.chezmoitemplates/claude-settings.json の enabledPlugins)。
# 書き方と判断基準は manage-skills スキルを参照。
skills:
  # agents を省略したソースに使う対象エージェント。
  defaultAgents:
    - claude-code
    - codex
    - cursor

  external:
    - source: mattpocock/skills
      skills:
        - codebase-design
        - domain-modeling
        - grill-me
        - grill-with-docs
        - grilling
        - improve-codebase-architecture
        - prototype
        - research
        - setup-matt-pocock-skills
        - triage
        - wayfinder

    - source: cathrynlavery/diagram-design
      skills:
        - diagram-design

    - source: humanlayer/skills
      skills:
        - show-me

    - source: vercel-labs/skills
      skills:
        - find-skills

    - source: kepano/obsidian-skills
      skills:
        - defuddle
        - json-canvas
        - obsidian-bases
        - obsidian-cli
        - obsidian-markdown

    - source: nanaism/yomiyasu
      skills:
        - yomiyasu

    # Claude Code は subagent (poteto-agent / comment-sicko) を同梱する
    # pstack@cursor-plugins プラグインで入れるため claude-code を外す。
    - source: cursor/plugins
      agents:
        - codex
        - cursor
      skills:
        - architect
        - arena
        - automate-me
        - benchmark-checklist
        - blast-radius
        - bro
        - correct
        - create-formal-verification-skill
        - create-verification-skill
        - figure-it-out
        - how
        - in-your-own-words
        - interrogate
        - ketchup
        - ketchup-video
        - maintain-formal-verification-skill
        - maintain-verification-skill
        - make-bot-ui
        - no-comments
        - poteto-help
        - poteto-mode
        - principle-attack-the-premise
        - principle-boundary-discipline
        - principle-build-the-lever
        - principle-encode-lessons-in-structure
        - principle-exhaust-the-design-space
        - principle-experience-first
        - principle-explain-the-number
        - principle-fix-root-causes
        - principle-foundational-thinking
        - principle-guard-the-context-window
        - principle-laziness-protocol
        - principle-make-operations-idempotent
        - principle-migrate-callers-then-delete-legacy-apis
        - principle-minimize-reader-load
        - principle-model-the-domain
        - principle-never-block-on-the-human
        - principle-outcome-oriented-execution
        - principle-prove-it-works
        - principle-redesign-from-first-principles
        - principle-separate-before-serializing-shared-state
        - principle-sequence-verifiable-units
        - principle-subtract-before-you-add
        - principle-test-behavior-not-implementation
        - principle-type-system-discipline
        - recall

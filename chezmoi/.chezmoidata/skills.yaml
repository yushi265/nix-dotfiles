        - setup-pstack
        - sharpen
        - show-me-your-work
        - statechart
        - swarm
        - tdd
        - teach
        - technical-writing
        - typescript-best-practices
        - unslop
        - why

    # Claude Code は cloudflare@cloudflare プラグイン (MCP 同梱) で入れるため
    # claude-code を外し、二重登録を避ける。Codex の MCP は
    # run_onchange_after_04-cloudflare-mcp.sh.tmpl で別途登録している。
    - source: cloudflare/skills
      agents:
        - codex

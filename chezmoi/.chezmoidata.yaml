# マシンごとの違いはここに集約する。キーは `chezmoi data` の hostname。
#
# features: 機能ごとに「入れるホスト」を並べる。テンプレートからは
#   {{ if has .chezmoi.hostname .features.aws }} ... {{ end }}
# のように参照する。どこにも載っていないホストには何も入らない。
features:
  # AWS プロファイル (~/.aws/config) と coleta 用のエイリアス
  aws:
    - mbp-m5
    - mbp-m1
  # invest-compass の /market-report を平日 8:10 に Claude Code で実行する LaunchAgent。
  # invest-compass を置いているホストだけに入れる（2台で同時に走らせない）
  market_report:
    - mbp-m5
  # invest-compass の買い場チェック（entry-alerts）を平日 7:45（寄り前）と 12:05（前場引け後）に
  # 実行する LaunchAgent。invest-compass と保有DBを置いているホストだけに入れる
  entry_alerts:
    - mbp-m5
